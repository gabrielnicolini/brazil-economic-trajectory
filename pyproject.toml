[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazil-economic-trajectory"
version = "0.1.0"
description = "Reproducible study of Brazil's economic trajectory since 2000"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "pyarrow",
    "databricks-sdk",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
